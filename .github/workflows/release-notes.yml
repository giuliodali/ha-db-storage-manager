name: Release notes

# When a release is published, replace its notes with the matching section of CHANGELOG.md
# (the "## 1.0.1" block for tag v1.0.1). Add the section before you tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}   # the changelog on main, even if the tag was cut a commit earlier
      - name: Write the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#[vV]}"
          # A pre-release tag such as v1.0.1-beta.1 uses the notes of 1.0.1.
          for v in "$version" "${version%%-*}"; do
            awk -v v="$v" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
            [ -s notes.md ] && break
          done
          if [ ! -s notes.md ]; then
            echo "No '## $version' section in CHANGELOG.md, leaving the release notes as they are."
            exit 0
          fi
          printf '\n\n**Full changelog**: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
