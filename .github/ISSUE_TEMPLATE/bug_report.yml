name: Bug report
description: Something does not work as described
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant, DB Storage Manager, and your recorder database type (SQLite is the supported one)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From Settings > System > Logs, filtered on db_storage_manager. Remove anything private.
