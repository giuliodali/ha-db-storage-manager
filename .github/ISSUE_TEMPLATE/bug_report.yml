name: Bug report
description: Something does not work as described
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant version and install type, DB Storage Manager version, and your recorder database with its version (SQLite, PostgreSQL, MariaDB or MySQL)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From Settings > System > Logs, filtered on db_storage_manager. For database problems, turn on debug logging first (logger, custom_components.db_storage_manager - see docs/troubleshooting.md), reproduce, and paste the lines. Remove anything private, and leave the password out of the recorder db_url.
